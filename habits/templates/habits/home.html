<h1>Hi, {{ user.username }}!</h1>

<h2>Your habits</h2>
<ul>
    {% for habit in habits %}
        <li>
            {{ habit.name }}
            <form method="post" action="{% url 'check_in' habit.id %}" style="display:inline">
                {% csrf_token %}
                <button type="submit">Done ✓</button>
            </form>
        </li>
    {% empty %}
        <li>No habits yet!</li>
    {% endfor %}
</ul>

<form method="post" action="{% url 'add_habit' %}">
    {% csrf_token %}
    <input type="text" name="name" placeholder="New habit" required>
    <button type="submit">Add</button>
</form>

<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Log out</button>
</form>
