{% extends 'habits/base.html' %}
{% block content %}

<div class="page-header">
    <div class="header-pup">🐶</div>
    <h1>Adopt a pup</h1>
    <p>Build study habits, one day at a time.</p>
</div>

<div class="panel">
    <form method="post" class="card auth">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="wide">Sign up</button>
    </form>

    <p class="switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>

{% endblock %}
